
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160923">
<title>ROOH START</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(circle at top,#49216b,#160923 65%);
 color:white;font-family:Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 padding:24px;
}
.app{width:100%;max-width:420px;text-align:center}
.logo{color:#e9c36e;font-size:46px;font-weight:bold;letter-spacing:5px}
.start{font-size:25px;letter-spacing:9px;color:white;margin:8px}
.line{height:2px;background:#d9ad55;margin:25px auto;width:65%}
h2{font-size:23px}
p{color:#d5c5e4;line-height:1.8}
input{
 width:100%;padding:16px;margin:9px 0;
 border:1px solid #8052a1;border-radius:12px;
 background:#261436;color:white;font-size:16px;
}
button{
 width:100%;padding:16px;margin-top:12px;
 border:0;border-radius:30px;
 background:linear-gradient(90deg,#f4d58b,#b98232);
 color:#24122d;font-weight:bold;font-size:17px;
}
.note{font-size:12px;margin-top:30px}
</style>
</head>
<body>
<main class="app">
 <div class="logo">♛ ROOH</div>
 <div class="start">START</div>
 <div class="line"></div>
 <h2>أهلاً بك في عالمنا الصوتي 💜</h2>
 <p>تواصل • دردش • اصنع صداقات جديدة</p>
 <input type="text" placeholder="رقم الهاتف أو البريد الإلكتروني">
 <input type="password" placeholder="كلمة المرور">
 <button type="button">تسجيل الدخول</button>
 <p>ليس لديك حساب؟</p>
 <button type="button">إنشاء حساب جديد</button>
 <div class="note">YOUR VOICE. YOUR WORLD.</div>
</main>
</body>
</html>
